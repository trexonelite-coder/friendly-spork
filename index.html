<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolWork Connect</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .slide-up {
            animation: slideUp 0.6s ease-out forwards;
        }

        .bounce-in {
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        #noise-btn {
  background-color: #ff4757; /* A bright "alert" red */
  color: white;
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 50px;       /* This makes the edges round */
  cursor: pointer;
  transition: 0.3s;          /* Makes it fade smoothly when hovered */
}

#noise-btn:hover {
  background-color: #ff6b81; /* Changes color when you point at it */
  transform: scale(1.05);    /* Makes it pop out slightly */
}
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform transition-all duration-300 translate-x-full opacity-0 bg-white border-l-4 p-4 rounded shadow-lg flex items-center gap-3 max-w-sm">
        <div id="toast-icon"></div>
        <div class="flex-1">
            <h4 id="toast-title" class="font-bold text-sm">Notification</h4>
            <p id="toast-msg" class="text-xs text-gray-600">Message goes here</p>
        </div>
    </div>

    <!-- AI Chat Modal -->
    <!-- AI Floating Button -->

    <!-- Main App Container -->
    <div id="app" class="flex-1 flex flex-col relative">
        <!-- Dynamic Content Injected Here -->
    </div>

    <script>
        // --- API CLIENT (Connects to Node.js Server) ---
        const API = {
            // Hardcoded Cloudflare Tunnel URL
            baseUrl: 'https://applied-reflection-freedom-semester.trycloudflare.com/api', 

            // Helper to get image URLs correct
            getImageUrl(path) {
                if (!path) return '';
                // Get the server root (remove /api)
                // Ensure no double slashes if path starts with /
                const serverRoot = this.baseUrl.replace(/\/api\/?$/, ''); 
                const cleanPath = path.startsWith('/') ? path : '/' + path;
                return `${serverRoot}${cleanPath}`;
            },

            async request(endpoint, options = {}) {
                try {
                    const headers = {
                        'Content-Type': 'application/json',
                        ...(options.headers || {})
                    };

                    const response = await fetch(`${this.baseUrl}${endpoint}`, {
                        ...options,
                        headers: headers
                    });

                    if (!response.ok) throw new Error(`Server Error: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    console.error('API Error:', error);
                    showToast('Connection Error', 'Cannot reach server. Is it running?', 'error');
                    throw error;
                }
            },

            // USERS
            async register(user) {
                return await this.request('/register', {
                    method: 'POST',
                    body: JSON.stringify(user)
                });
            },

            async login(username, password, role) {
                return await this.request('/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password, role })
                });
            },

            async getUsers() {
                return await this.request('/users');
            },

            // CLASSES
            async getClasses() {
                return await this.request('/classes');
            },

            async saveClass(cls) {
                return await this.request('/classes', {
                    method: 'POST',
                    body: JSON.stringify(cls)
                });
            },

            async joinClass(studentUsername, classCode) {
                const res = await this.request('/classes/join', {
                    method: 'POST',
                    body: JSON.stringify({ studentUsername, classCode })
                });
                if (res.status === true) return true;
                return res.status; // 'already_joined' or 'not_found'
            },

            // HOMEWORKS
            async getHomeworks() {
                return await this.request('/homeworks');
            },

            async saveHomework(hwData, file) {
                const formData = new FormData();
                formData.append('id', hwData.id);
                formData.append('studentUsername', hwData.studentUsername);
                formData.append('teacherUsername', hwData.teacherUsername);
                formData.append('classCode', hwData.classCode || '');
                formData.append('status', hwData.status);
                formData.append('timestamp', hwData.timestamp);
                formData.append('studentMessage', hwData.studentMessage || '');
                formData.append('image', file);

                const response = await fetch(`${this.baseUrl}/homeworks`, {
                    method: 'POST',
                    body: formData 
                });
                return await response.json();
            },

            async updateHomeworkStatus(id, status, feedback = '') {
                return await this.request(`/homeworks/${id}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ status, feedback })
                });
            }
        };

        // --- AI CLIENT (Groq) ---
        // --- AI CLIENT (Talks to your Backend) ---
const AI_Agent = {
    async chat(message) {
        try {
            const response = await fetch(`${API.baseUrl}/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error || "Server Error");
            }
            
            return data.text; // Now we just get the 'text' field
        } catch (err) {
            console.error("AI Client Error:", err);
            return "Error: " + err.message;
        }
    }
};
    
    // Mapping old DB calls to new API calls for compatibility
        const DB = {
            init: async () => { console.log("Connected to Real Server"); },
            getUsers: API.getUsers.bind(API),
            getClasses: API.getClasses.bind(API),
            getHomeworks: API.getHomeworks.bind(API),
            saveClass: API.saveClass.bind(API),
            joinClass: API.joinClass.bind(API),
            updateHomeworkStatus: API.updateHomeworkStatus.bind(API)
        };

        // --- STATE MANAGEMENT ---
        let studentKnownApprovedIds = new Set();

        const State = {
            currentUser: JSON.parse(sessionStorage.getItem('sw_current_user') || 'null'),
            currentView: 'landing', // landing, auth, dashboard_student, dashboard_teacher
            pollTimer: null,

            init: async () => {
                await DB.init();
                if (State.currentUser) {
                    State.currentView = `dashboard_${State.currentUser.role}`;
                }
                render();
            },

            login: (user) => {
                State.currentUser = user;
                sessionStorage.setItem('sw_current_user', JSON.stringify(user));
                render();
            },
            logout: () => {
                State.currentUser = null;
                sessionStorage.removeItem('sw_current_user');
                State.setView('landing');
            },
            setView: (view) => {
                if (State.pollTimer) clearInterval(State.pollTimer);
                State.currentView = view;
                render();
                
                // Manage AI Button Visibility
                const aiBtn = document.getElementById('ai-fab');
                if (view.startsWith('dashboard')) {
                    aiBtn.classList.remove('hidden');
                } else {
                    aiBtn.classList.add('hidden');
                    document.getElementById('ai-modal').classList.add('hidden');
                }

                // Auto-refresh logic
                if (view === 'dashboard_teacher') {
                    State.pollTimer = setInterval(checkUpdates, 3000); 
                } else if (view === 'dashboard_student') {
                    // Initialize known approved IDs so we don't alert for old stuff
                    DB.getHomeworks().then(homeworks => {
                        const user = State.currentUser;
                        homeworks.filter(h => h.studentUsername === user.username && h.status === 'approved')
                                 .forEach(h => studentKnownApprovedIds.add(h.id));
                        
                        State.pollTimer = setInterval(checkStudentUpdates, 3000);
                    });
                }
            }
        };

        // --- POLLING LOGIC ---
        let lastDataHash = '';

        async function checkUpdates() {
            if (State.currentView !== 'dashboard_teacher') return;
            
            try {
                // Silent fetch
                const classes = await DB.getClasses();
                const homeworks = await DB.getHomeworks();
                
                const user = State.currentUser;
                const myPending = homeworks.filter(h => h.teacherUsername === user.username && h.status === 'pending');
                const myHistory = homeworks.filter(h => h.teacherUsername === user.username && h.status === 'approved');
                
                // Simple signature to detect changes
                const currentHash = `P:${myPending.length}-${myPending[0]?.id || ''}|H:${myHistory.length}`;
                
                if (currentHash !== lastDataHash) {
                    lastDataHash = currentHash;
                    updateTeacherDashboardContent(classes, homeworks);
                }
            } catch (e) {
                console.log("Polling failed (server offline?)");
            }
        }

        function updateTeacherDashboardContent(classes, homeworks) {
            const user = State.currentUser;
            const myClasses = classes.filter(c => c.teacherUsername === user.username);
            const myHomeworks = homeworks.filter(h => h.teacherUsername === user.username);
            const pendingHomeworks = myHomeworks.filter(h => h.status === 'pending');
            
            const statsEl = document.getElementById('dashboard-stats');
            if (statsEl) statsEl.innerHTML = getTeacherStatsHTML(myClasses, pendingHomeworks);
            
            const inboxEl = document.getElementById('dashboard-inbox');
            if (inboxEl) inboxEl.innerHTML = getInboxHTML(pendingHomeworks);
            
            const historyEl = document.getElementById('dashboard-history');
            if (historyEl) historyEl.innerHTML = getHistoryHTML(myHomeworks);
        }

        async function checkStudentUpdates() {
            if (State.currentView !== 'dashboard_student') return;
            
            try {
                const homeworks = await DB.getHomeworks();
                const user = State.currentUser;
                const myHomeworks = homeworks.filter(h => h.studentUsername === user.username);
                
                // Check for new approvals
                myHomeworks.forEach(h => {
                    if (h.status === 'approved' && !studentKnownApprovedIds.has(h.id)) {
                        studentKnownApprovedIds.add(h.id);
                        showToast('Homework Approved!', `Your work sent to ${h.teacherUsername} has been approved!`, 'success');
                    }
                });

                // Update UI
                const submissionsEl = document.getElementById('student-submissions-list');
                if (submissionsEl) {
                    submissionsEl.innerHTML = getStudentSubmissionsHTML(myHomeworks);
                }
            } catch (e) {
                console.log("Polling failed");
            }
        }

        // --- HTML GENERATORS (For Polling) ---
        function getTeacherStatsHTML(classes, pendingHomeworks) {
            return `
                <div class="bg-purple-600 rounded-xl p-6 text-white shadow-lg shadow-purple-200">
                    <h3 class="text-lg font-semibold opacity-90">Pending Reviews</h3>
                    <p class="text-4xl font-bold mt-2" id="stats-count">${pendingHomeworks.length}</p>
                </div>
                
                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
                    <h3 class="text-lg font-semibold text-gray-700">Your Classes</h3>
                    <div class="mt-4 space-y-2">
                        ${classes.length === 0 ? '<p class="text-sm text-gray-400">No classes yet.</p>' : ''}
                        ${classes.slice(0, 3).map(c => `
                            <div class="flex justify-between items-center text-sm bg-gray-50 p-2 rounded">
                                <span class="font-medium">${c.name}</span>
                                <span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-xs font-mono select-all">${c.code}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 flex flex-col justify-center items-center text-center">
                    <button onclick="toggleModal('create-class-modal')" class="bg-purple-100 text-purple-700 hover:bg-purple-200 p-4 rounded-full w-16 h-16 flex items-center justify-center transition mb-2">
                        <i class="fas fa-plus text-2xl"></i>
                    </button>
                    <span class="font-medium text-gray-700">Create New Class</span>
                </div>
            `;
        }

        function getInboxHTML(pendingHomeworks) {
             if (pendingHomeworks.length === 0) {
                return `
                    <div class="bg-white rounded-2xl shadow-sm p-12 text-center border-2 border-dashed border-gray-200 slide-up">
                        <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-check-double text-gray-300 text-3xl"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">Oh, there are no homeworks I suppose!</h3>
                        <p class="text-gray-500 mb-6">Why not create a class assignment or wait for students to upload?</p>
                    </div>
                `;
             }
             return `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${pendingHomeworks.map(hw => {
                        const imgUrl = API.getImageUrl(hw.images[0]);
                        return `
                        <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 slide-up" data-hw-id="${hw.id}">
                            <div class="relative h-48 bg-gray-200">
                                <img src="${imgUrl}" alt="Homework" class="w-full h-full object-cover cursor-pointer" onclick="viewImage('${imgUrl}')" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Load+Error'">
                                <div class="absolute bottom-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm">
                                    ${new Date(hw.timestamp).toLocaleDateString()}
                                </div>
                            </div>
                            <div class="p-5">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <h4 class="font-bold text-lg text-gray-800">${hw.studentUsername}</h4>
                                        <p class="text-sm text-gray-500">Class: <span class="font-mono bg-gray-100 px-1 rounded">${hw.classCode || 'Direct'}</span></p>
                                    </div>
                                    <button onclick="viewImage('${imgUrl}')" class="text-purple-600 hover:text-purple-800 text-sm font-medium">Review</button>
                                </div>
                                
                                ${hw.studentMessage ? `<div class="bg-blue-50 text-blue-800 p-2 rounded text-sm mb-4 italic">"${hw.studentMessage}"</div>` : ''}

                                <div class="mb-4">
                                    <label class="text-xs font-bold text-gray-500 uppercase">Feedback</label>
                                    <input type="text" id="feedback-${hw.id}" placeholder="Good job!" class="w-full border border-gray-300 rounded px-2 py-1 text-sm mt-1 focus:outline-none focus:border-purple-500">
                                    <div class="flex flex-wrap gap-1 mt-2">
                                        <button onclick="setFeedback('${hw.id}', 'Great work! ⭐')" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded">Great Work! ⭐</button>
                                        <button onclick="setFeedback('${hw.id}', 'Check Q3 🧐')" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded">Check Q3 🧐</button>
                                        <button onclick="setFeedback('${hw.id}', 'See me please 👩‍🏫')" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded">See me 👩‍🏫</button>
                                    </div>
                                </div>

                                <button onclick="approveHomework('${hw.id}')" class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 rounded-lg transition flex items-center justify-center gap-2">
                                    <i class="fas fa-check"></i> Approve & Send
                                </button>
                            </div>
                        </div>
                    `}).join('')}
                </div>
            `;
        }

        function getHistoryHTML(myHomeworks) {
            return `
                <h2 class="text-xl font-bold text-gray-800 mb-4 opacity-70 flex items-center gap-2">
                    <i class="fas fa-history text-gray-400"></i> History (Approved)
                </h2>
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                    ${myHomeworks.filter(h => h.status === 'approved').map(hw => {
                        const imgUrl = API.getImageUrl(hw.images[0]);
                        return `
                        <div class="bg-white rounded-lg shadow opacity-75 hover:opacity-100 transition overflow-hidden">
                            <div class="h-32 bg-gray-200">
                                <img src="${imgUrl}" class="w-full h-full object-cover cursor-pointer" onclick="viewImage('${imgUrl}')" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Load+Error'">
                            </div>
                            <div class="p-2">
                                <p class="font-bold text-xs truncate">${hw.studentUsername}</p>
                                <p class="text-xs text-green-600"><i class="fas fa-check-circle"></i> Approved</p>
                            </div>
                        </div>
                    `}).join('')}
                </div>
            `;
        }

        function getStudentSubmissionsHTML(homeworks) {
            // Sort by newest first
            const sorted = [...homeworks].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            if (sorted.length === 0) return '<p class="text-gray-400 text-sm italic">No submissions yet.</p>';

            return sorted.map(h => {
                const isApproved = h.status === 'approved';
                const imgUrl = API.getImageUrl(h.images[0]);
                return `
                <div class="bg-gray-50 rounded-lg p-3 flex gap-3 items-center hover:bg-white hover:shadow-md transition">
                    <div class="w-12 h-12 bg-gray-200 rounded overflow-hidden flex-shrink-0">
                        <img src="${imgUrl}" class="w-full h-full object-cover" onclick="viewImage('${imgUrl}')" onerror="this.src='https://via.placeholder.com/100x100?text=Error'">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <p class="font-bold text-sm text-gray-800 truncate">To: ${h.teacherUsername}</p>
                            <span class="text-xs ${isApproved ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'} px-2 py-0.5 rounded-full">
                                ${isApproved ? '<i class="fas fa-check"></i> Approved' : '<i class="fas fa-clock"></i> Pending'}
                            </span>
                        </div>
                        <p class="text-xs text-gray-500">${new Date(h.timestamp).toLocaleString()}</p>
                        ${h.teacherFeedback ? `<p class="text-xs text-green-600 mt-1 font-medium"><i class="fas fa-comment"></i> ${h.teacherFeedback}</p>` : ''}
                    </div>
                </div>
            `}).join('');
        }

        // --- UTILS ---
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function generateClassCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        function showToast(title, msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastTitle.innerText = title;
            toastMsg.innerText = msg;
            
            let colorClass = 'border-blue-500';
            let iconHtml = '<i class="fas fa-info-circle text-blue-500 text-xl"></i>';

            if (type === 'success') {
                colorClass = 'border-green-500';
                iconHtml = '<i class="fas fa-check-circle text-green-500 text-xl"></i>';
            } else if (type === 'error') {
                colorClass = 'border-red-500';
                iconHtml = '<i class="fas fa-exclamation-circle text-red-500 text-xl"></i>';
            }

            toast.className = `fixed top-5 right-5 z-50 transform transition-all duration-300 bg-white border-l-4 p-4 rounded shadow-lg flex items-center gap-3 max-w-sm translate-x-0 opacity-100 ${colorClass}`;
            toastIcon.innerHTML = iconHtml;

            setTimeout(() => {
                toast.classList.remove('translate-x-0', 'opacity-100');
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3000);
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                // Use ObjectURL instead of FileReader for instant loading
                const url = URL.createObjectURL(file);
                const img = new Image();
                
                img.onload = () => {
                    URL.revokeObjectURL(url); // Clean up memory
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Resize to max 800px width
                    
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert directly to Blob (efficient & async)
                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            // If compression fails, return original file
                            console.warn("Canvas blob creation failed, using original.");
                            resolve(file);
                        }
                    }, 'image/jpeg', 0.7); // 70% quality
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    console.error("Image failed to load, sending original.");
                    resolve(file); // Fallback to original
                };

                img.src = url;
            });
        }

        function dataURLtoBlob(dataurl) {
            var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--){
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], {type:mime});
        }

        // --- AI UI FUNCTIONS ---
        function toggleAiChat() {
            const modal = document.getElementById('ai-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('ai-input').focus();
            }
        }

        function handleAiKey(e) {
            if (e.key === 'Enter') sendAiMessage();
        }

        async function sendAiMessage() {
            const input = document.getElementById('ai-input');
            const container = document.getElementById('ai-messages');
            const msg = input.value.trim();
            if (!msg) return;

            // User Bubble
            container.innerHTML += `
                <div class="bg-blue-500 text-white p-3 rounded-tl-xl rounded-bl-xl rounded-br-xl self-end max-w-[90%]">
                    ${msg}
                </div>
            `;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Loading Bubble
            const loadingId = 'ai-loading-' + Date.now();
            container.innerHTML += `
                <div id="${loadingId}" class="bg-gray-200 text-gray-500 p-3 rounded-tr-xl rounded-br-xl rounded-bl-xl self-start max-w-[90%] animate-pulse">
                    Thinking... 🤖
                </div>
            `;
            container.scrollTop = container.scrollHeight;

            // AI Response
            const reply = await AI_Agent.chat(msg);
            
            // Remove Loading
            const loader = document.getElementById(loadingId);
            if (loader) loader.remove();

            // AI Bubble
            container.innerHTML += `
                <div class="bg-purple-100 text-purple-800 p-3 rounded-tr-xl rounded-br-xl rounded-bl-xl self-start max-w-[90%]">

                </div>
            `;
            container.scrollTop = container.scrollHeight;
        }
