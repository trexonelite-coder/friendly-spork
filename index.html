        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .slide-up {
            animation: slideUp 0.6s ease-out forwards;
        }

        .bounce-in {
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
#season-overlay {
    position: fixed !important;
    inset: 0 !important;
    pointer-events: none !important;
    z-index: 999999 !important;
    overflow: hidden !important;
}

.snow-flake {
    position: absolute;
    background: rgb(96, 157, 187) !important;
    border-radius: 50%;
    top: -20px; /* Starts above the screen */
    box-shadow: 0 0 10px white;
    animation: fall-snow linear infinite;
}

.rain-drop {
    position: absolute;
    background: rgba(255,255,255,0.6) !important;
    width: 2px;
    height: 60px;
    top: -80px; /* Starts way above the screen */
    animation: fall-rain linear infinite;
}

@keyframes fall-snow {
    0% { transform: translateY(0) translateX(0); }
    100% { transform: translateY(110vh) translateX(20px); }
}

@keyframes fall-rain {
    0% { transform: translateY(0); }
    100% { transform: translateY(110vh); }
}
/* --- FULL MIDNIGHT VIBE --- */
body.dark-mode {
    background-color: #020617 !important; /* Deepest Navy Black */
    color: #f8fafc !important;
    transition: background-color 0.5s ease;
}

/* Make the whole app container blend into the dark */
body.dark-mode #app {
    background-color: transparent !important;
}

/* Darken all containers/cards */
body.dark-mode .bg-white, 
body.dark-mode .bg-slate-50, 
body.dark-mode .shadow-sm {
    background-color: #0f172a !important; /* Midnight Blue Card */
    color: #f1f5f9 !important;
    border: 1px solid #1e293b !important;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6) !important;
}

/* ACCURATE TYPING FIX: Dark boxes with White letters */
body.dark-mode input, 
body.dark-mode textarea,
body.dark-mode select {
    background-color: #1e293b !important;

}

/* Glow for the Weather */
body.dark-mode .rain-drop {
    background: linear-gradient(to bottom, transparent, #3b82f6) !important;

    width: 1.5px;
}

body.dark-mode .snow-flake {
    box-shadow: 0 0 12px 3px rgba(255, 255, 255, 0.4);
}

<audio id="rain-sound" src="https://upload.wikimedia.org/wikipedia/commons/3/36/Rain_on_roof_loop.ogg" loop></audio>

<div id="vibe-menu" style="position: fixed; bottom: 20px; left: 20px; z-index: 999999; display: flex; gap: 10px; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); padding: 10px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2);">

        // --- API CLIENT (Connects to Node.js Server) ---
      // 1. Hide and Show Toggle
function toggleAiChat() {
    const chatWin = document.getElementById('ai-chat-window');
    chatWin.classList.toggle('hidden');
}

// 2. The AI Agent (Direct to Groq)
const AI_Agent = {
    // PASTE YOUR GROQ KEY INSIDE THE QUOTES BELOW
    key: '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', 
    
    async chat(message) {
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${this.key}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: message }]
                })
            });
            const data = await response.json();
            return data.choices[0].message.content;
        } catch (err) {
            console.error(err);
            return "Connection blocked. You might need to use your server.js proxy! 🥶";
        }
    }
};

// 3. The Send Function (Actually Works)
async function sendAiMessage() {
    const input = document.getElementById('ai-input');
    const container = document.getElementById('ai-messages');
    const msg = input.value.trim();
    
    if (!msg) return;

    // Show User Message
    container.innerHTML += `<div style="background: #3b82f6; color: white; padding: 8px 12px; border-radius: 10px; align-self: flex-end; margin-left: 20px;">${msg}</div>`;
    input.value = '';
    container.scrollTop = container.scrollHeight;

    // Show "Thinking..."
    const thinking = document.createElement('div');
    thinking.style.cssText = "background: #e2e8f0; padding: 8px 12px; border-radius: 10px; align-self: flex-start; color: #64748b;";
    thinking.innerText = "Typing...";
    container.appendChild(thinking);

    // Get Answer
    const answer = await AI_Agent.chat(msg);
    
    // Replace Thinking with Answer
    thinking.innerText = answer;
    thinking.style.color = "#1e293b";
    thinking.style.background = "#ffffff";
    thinking.style.border = "1px solid #e2e8f0";
    container.scrollTop = container.scrollHeight;
}
            // USERS
            async register(user) {
                return await this.request('/register', {
                    method: 'POST',
                    body: JSON.stringify(user)
                });
            },

            async login(username, password, role) {
                return await this.request('/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password, role })
                });
            },

            async getUsers() {
                return await this.request('/users');
            },

            // CLASSES
            async getClasses() {
                return await this.request('/classes');
            },

            async saveClass(cls) {
                return await this.request('/classes', {
                    method: 'POST',
                    body: JSON.stringify(cls)
                });
            },

            async joinClass(studentUsername, classCode) {
                const res = await this.request('/classes/join', {
                    method: 'POST',
                    body: JSON.stringify({ studentUsername, classCode })
                });
                if (res.status === true) return true;
                return res.status; // 'already_joined' or 'not_found'
            },

            // HOMEWORKS
            async getHomeworks() {
                return await this.request('/homeworks');
            },

            async saveHomework(hwData, file) {
                const formData = new FormData();
                formData.append('id', hwData.id);
                formData.append('studentUsername', hwData.studentUsername);
                formData.append('teacherUsername', hwData.teacherUsername);
                formData.append('classCode', hwData.classCode || '');
                formData.append('status', hwData.status);
                formData.append('timestamp', hwData.timestamp);
                formData.append('studentMessage', hwData.studentMessage || '');
                formData.append('image', file);

                const response = await fetch(`${this.baseUrl}/homeworks`, {
                    method: 'POST',
                    body: formData 
                });
                return await response.json();
            },

            async updateHomeworkStatus(id, status, feedback = '') {
                return await this.request(`/homeworks/${id}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ status, feedback })
                });
            }
        };

        // --- AI CLIENT (Groq) ---

const AI_Agent = {
    // WARNING: Anyone who looks at your website code can see this key!

};

        // Mapping old DB calls to new API calls for compatibility
        const DB = {
            init: async () => { console.log("Connected to Real Server"); },
            getUsers: API.getUsers.bind(API),
            getClasses: API.getClasses.bind(API),
            getHomeworks: API.getHomeworks.bind(API),
            saveClass: API.saveClass.bind(API),
            joinClass: API.joinClass.bind(API),
            updateHomeworkStatus: API.updateHomeworkStatus.bind(API)
        };

        // --- STATE MANAGEMENT ---
        let studentKnownApprovedIds = new Set();

        const State = {
            currentUser: JSON.parse(sessionStorage.getItem('sw_current_user') || 'null'),
            currentView: 'landing', // landing, auth, dashboard_student, dashboard_teacher
            pollTimer: null,

            init: async () => {
                await DB.init();
                if (State.currentUser) {
                    State.currentView = `dashboard_${State.currentUser.role}`;
                }
                render();
            },

            login: (user) => {
                State.currentUser = user;
                sessionStorage.setItem('sw_current_user', JSON.stringify(user));
                render();
            },
            logout: () => {
                State.currentUser = null;
                sessionStorage.removeItem('sw_current_user');
                State.setView('landing');
            },
            setView: (view) => {
                if (State.pollTimer) clearInterval(State.pollTimer);
                State.currentView = view;
                render();
                
                // Manage AI Button Visibility
                const aiBtn = document.getElementById('ai-fab');
                if (view.startsWith('dashboard')) {
                    aiBtn.classList.remove('hidden');
                } else {
                    aiBtn.classList.add('hidden');
                    document.getElementById('ai-modal').classList.add('hidden');
                }

                // Auto-refresh logic
                if (view === 'dashboard_teacher') {
                    State.pollTimer = setInterval(checkUpdates, 3000); 
                } else if (view === 'dashboard_student') {
                    // Initialize known approved IDs so we don't alert for old stuff
                    DB.getHomeworks().then(homeworks => {
                        const user = State.currentUser;
                        homeworks.filter(h => h.studentUsername === user.username && h.status === 'approved')
                                 .forEach(h => studentKnownApprovedIds.add(h.id));
                        
                        State.pollTimer = setInterval(checkStudentUpdates, 3000);
                    });
                }
            }
        };

        // --- POLLING LOGIC ---
        let lastDataHash = '';

        async function checkUpdates() {
            if (State.currentView !== 'dashboard_teacher') return;
            
            try {
                // Silent fetch
                const classes = await DB.getClasses();
                const homeworks = await DB.getHomeworks();
                
                const user = State.currentUser;
                const myPending = homeworks.filter(h => h.teacherUsername === user.username && h.status === 'pending');
                const myHistory = homeworks.filter(h => h.teacherUsername === user.username && h.status === 'approved');
                
                // Simple signature to detect changes
                const currentHash = `P:${myPending.length}-${myPending[0]?.id || ''}|H:${myHistory.length}`;
                
                if (currentHash !== lastDataHash) {
                    lastDataHash = currentHash;
                    updateTeacherDashboardContent(classes, homeworks);
                }
            } catch (e) {
                console.log("Polling failed (server offline?)");
            }
        }

        function updateTeacherDashboardContent(classes, homeworks) {
            const user = State.currentUser;
            const myClasses = classes.filter(c => c.teacherUsername === user.username);
            const myHomeworks = homeworks.filter(h => h.teacherUsername === user.username);
            const pendingHomeworks = myHomeworks.filter(h => h.status === 'pending');
            
            const statsEl = document.getElementById('dashboard-stats');
            if (statsEl) statsEl.innerHTML = getTeacherStatsHTML(myClasses, pendingHomeworks);
            
            const inboxEl = document.getElementById('dashboard-inbox');
            if (inboxEl) inboxEl.innerHTML = getInboxHTML(pendingHomeworks);
            
            const historyEl = document.getElementById('dashboard-history');
            if (historyEl) historyEl.innerHTML = getHistoryHTML(myHomeworks);
        }

        async function checkStudentUpdates() {
            if (State.currentView !== 'dashboard_student') return;
            
            try {
                const homeworks = await DB.getHomeworks();
                const user = State.currentUser;
                const myHomeworks = homeworks.filter(h => h.studentUsername === user.username);
                
                // Check for new approvals
                myHomeworks.forEach(h => {
                    if (h.status === 'approved' && !studentKnownApprovedIds.has(h.id)) {
                        studentKnownApprovedIds.add(h.id);
                        showToast('Homework Approved!', `Your work sent to ${h.teacherUsername} has been approved!`, 'success');
                    }
                });

                // Update UI
                const submissionsEl = document.getElementById('student-submissions-list');
                if (submissionsEl) {
                    submissionsEl.innerHTML = getStudentSubmissionsHTML(myHomeworks);
                }
            } catch (e) {
                console.log("Polling failed");
            }
        }

        // --- HTML GENERATORS (For Polling) ---
        function getTeacherStatsHTML(classes, pendingHomeworks) {
            return `
                <div class="bg-purple-600 rounded-xl p-6 text-white shadow-lg shadow-purple-200">
                    <h3 class="text-lg font-semibold opacity-90">Pending Reviews</h3>
                    <p class="text-4xl font-bold mt-2" id="stats-count">${pendingHomeworks.length}</p>
                </div>
                
                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
                    <h3 class="text-lg font-semibold text-gray-700">Your Classes</h3>
                    <div class="mt-4 space-y-2">
                        ${classes.length === 0 ? '<p class="text-sm text-gray-400">No classes yet.</p>' : ''}
                        ${classes.slice(0, 3).map(c => `
                            <div class="flex justify-between items-center text-sm bg-gray-50 p-2 rounded">
                                <span class="font-medium">${c.name}</span>
                                <span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-xs font-mono select-all">${c.code}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 flex flex-col justify-center items-center text-center">
                    <button onclick="toggleModal('create-class-modal')" class="bg-purple-100 text-purple-700 hover:bg-purple-200 p-4 rounded-full w-16 h-16 flex items-center justify-center transition mb-2">
                        <i class="fas fa-plus text-2xl"></i>
                    </button>
                    <span class="font-medium text-gray-700">Create New Class</span>
                </div>
            `;
        }

        function getInboxHTML(pendingHomeworks) {
             if (pendingHomeworks.length === 0) {
                return `
                    <div class="bg-white rounded-2xl shadow-sm p-12 text-center border-2 border-dashed border-gray-200 slide-up">
                        <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-check-double text-gray-300 text-3xl"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">Oh, there are no homeworks I suppose!</h3>
                        <p class="text-gray-500 mb-6">Why not create a class assignment or wait for students to upload?</p>
                    </div>
                `;
             }
             return `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${pendingHomeworks.map(hw => {
                        const imgUrl = API.getImageUrl(hw.images[0]);
                        return `
                        <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 slide-up" data-hw-id="${hw.id}">
                            <div class="relative h-48 bg-gray-200">
                                <img src="${imgUrl}" alt="Homework" class="w-full h-full object-cover cursor-pointer" onclick="viewImage('${imgUrl}')" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Load+Error'">
                                <div class="absolute bottom-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm">
                                    ${new Date(hw.timestamp).toLocaleDateString()}
                                </div>
                            </div>
                            <div class="p-5">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <h4 class="font-bold text-lg text-gray-800">${hw.studentUsername}</h4>
                                        <p class="text-sm text-gray-500">Class: <span class="font-mono bg-gray-100 px-1 rounded">${hw.classCode || 'Direct'}</span></p>
                                    </div>
                                    <button onclick="viewImage('${imgUrl}')" class="text-purple-600 hover:text-purple-800 text-sm font-medium">Review</button>
                                </div>
                                
                                ${hw.studentMessage ? `<div class="bg-blue-50 text-blue-800 p-2 rounded text-sm mb-4 italic">"${hw.studentMessage}"</div>` : ''}

                                <div class="mb-4">
                                    <label class="text-xs font-bold text-gray-500 uppercase">Feedback</label>
                                    <input type="text" id="feedback-${hw.id}" placeholder="Good job!" class="w-full border border-gray-300 rounded px-2 py-1 text-sm mt-1 focus:outline-none focus:border-purple-500">
                                    <div class="flex flex-wrap gap-1 mt-2">
                                        <button onclick="setFeedback('${hw.id}', 'Great work! ⭐')" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded">Great Work! ⭐</button>
                                        <button onclick="setFeedback('${hw.id}', 'Check Q3 🧐')" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded">Check Q3 🧐</button>
                                        <button onclick="setFeedback('${hw.id}', 'See me please 👩‍🏫')" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded">See me 👩‍🏫</button>
                                    </div>
                                </div>

                                <button onclick="approveHomework('${hw.id}')" class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 rounded-lg transition flex items-center justify-center gap-2">
                                    <i class="fas fa-check"></i> Approve & Send
                                </button>
                            </div>
                        </div>
                    `}).join('')}
                </div>
            `;
        }

        function getHistoryHTML(myHomeworks) {
            return `
                <h2 class="text-xl font-bold text-gray-800 mb-4 opacity-70 flex items-center gap-2">
                    <i class="fas fa-history text-gray-400"></i> History (Approved)
                </h2>
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                    ${myHomeworks.filter(h => h.status === 'approved').map(hw => {
                        const imgUrl = API.getImageUrl(hw.images[0]);
                        return `
                        <div class="bg-white rounded-lg shadow opacity-75 hover:opacity-100 transition overflow-hidden">
                            <div class="h-32 bg-gray-200">
                                <img src="${imgUrl}" class="w-full h-full object-cover cursor-pointer" onclick="viewImage('${imgUrl}')" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Load+Error'">
                            </div>

        function showToast(title, msg, type = 'info') {
            const toast = document.getElementById('toast');

            toastTitle.innerText = title;

            let colorClass = 'border-blue-500';
            let iconHtml = '<i class="fas fa-info-circle text-blue-500 text-xl"></i>';

            if (type === 'success') {
                colorClass = 'border-green-500';
                iconHtml = '<i class="fas fa-check-circle text-green-500 text-xl"></i>';
            } else if (type === 'error') {
                colorClass = 'border-red-500';

            }

            toast.className = `fixed top-5 right-5 z-50 transform transition-all duration-300 bg-white border-l-4 p-4 rounded shadow-lg flex items-center gap-3 max-w-sm translate-x-0 opacity-100 ${colorClass}`;

            }, 3000);
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                // Use ObjectURL instead of FileReader for instant loading
                const url = URL.createObjectURL(file);
                const img = new Image();
                
                img.onload = () => {
                    URL.revokeObjectURL(url); // Clean up memory
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Resize to max 800px width
                    
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert directly to Blob (efficient & async)
                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            // If compression fails, return original file
                            console.warn("Canvas blob creation failed, using original.");
                            resolve(file);
                        }
                    }, 'image/jpeg', 0.7); // 70% quality
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    console.error("Image failed to load, sending original.");
                    resolve(file); // Fallback to original
                };

                img.src = url;
            });
        }

        function dataURLtoBlob(dataurl) {
            var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--){
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], {type:mime});
        }

        // Image Viewer Modal (Shared)
        function renderImageViewer() {
            return `
                <div id="image-viewer" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4" onclick="closeImageViewer()">
                    <button class="absolute top-4 right-4 text-white hover:text-gray-300 z-50">
                        <i class="fas fa-times text-2xl"></i>

                    <img id="image-viewer-src" class="max-w-full max-h-screen rounded shadow-2xl transform scale-95 transition-transform duration-300">

        // --- RENDER FUNCTION ---
        async function render() {
            const app = document.getElementById('app');
            
            // Simple Loading State
            if (State.currentView.startsWith('dashboard')) {
                app.innerHTML = '<div class="flex items-center justify-center min-h-screen"><i class="fas fa-spinner fa-spin text-4xl text-blue-500"></i></div>';
            }

            let content = '';

            try {
                switch(State.currentView) {
                    case 'landing':
                        content = renderLanding();
                        break;
                    case 'auth_student':
                        content = renderAuth('student');
                        break;
                    case 'auth_teacher':
                        content = renderAuth('teacher');
                        break;
                    case 'dashboard_student':
                        if (!State.currentUser) { State.setView('landing'); return; }
                        const allClassesStudent = await DB.getClasses();
                        const allUsers = await DB.getUsers();
                        const allTeachers = allUsers.filter(u => u.role === 'teacher');
                        const allHomeworks = await DB.getHomeworks();
                        const myHomeworks = allHomeworks.filter(h => h.studentUsername === State.currentUser.username);
                        content = renderStudentDashboard(allClassesStudent, allTeachers, myHomeworks);
                        break;
                    case 'dashboard_teacher':
                        if (!State.currentUser) { State.setView('landing'); return; }
                        const classes = await DB.getClasses();
                        const homeworks = await DB.getHomeworks();
                        content = renderTeacherDashboard(classes, homeworks);
                        break;
                }

                content += renderImageViewer();
                app.innerHTML = content;
                
            } catch (err) {
                console.error("Render error:", err);
                app.innerHTML = '<div class="text-center p-10 text-red-500">Error loading data. Check console.</div>';
            }
        }

        // --- EVENT HANDLERS & LOGIC ---

        function openAuth(role) {
            State.setView(`auth_${role}`);
        }

        function toggleAuthMode(mode) {
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const theme = State.currentView.includes('student') ? 'blue' : 'purple';

            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                
                tabLogin.classList.add(`text-${theme}-600`, `border-${theme}-600`);
                tabLogin.classList.remove('text-gray-400');
                
                tabRegister.classList.remove(`text-${theme}-600`, `border-${theme}-600`);
                tabRegister.classList.add('text-gray-400');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');

                tabRegister.classList.add(`text-${theme}-600`, `border-${theme}-600`);
                tabRegister.classList.remove('text-gray-400');
                
                tabLogin.classList.remove(`text-${theme}-600`, `border-${theme}-600`);
                tabLogin.classList.add('text-gray-400');
            }
        }

        async function handleRegister(e, role) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const username = formData.get('username');
            const password = formData.get('password');
            const confirmPassword = formData.get('confirm_password');

            if (password !== confirmPassword) {
                showToast('Oops!', 'Passwords do not match! Try again.', 'error');
                return;
            }

            try {
                const result = await API.register({ username, password, role });
                if (result.success) {
                    showToast('Awesome!', 'Account created! Welcome aboard!', 'success');
                    
                    // Auto-login immediately
                    const loginRes = await API.login(username, password, role);
                    if (loginRes.success) {
                        State.login(loginRes.user);
                        State.setView(`dashboard_${role}`);
                    } else {
                        toggleAuthMode('login'); // Fallback
                    }
                } else {
                    showToast('Uh oh', result.error || 'Registration failed', 'error');
                }
            } catch (err) {
                showToast('Oh no!', 'Could not connect to the server.', 'error');
            }
        }

        async function handleLogin(e, role) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const username = formData.get('username');
            const password = formData.get('password');

            try {
                const result = await API.login(username, password, role);
                
                if (result.success) {
                    State.login(result.user);
                    State.setView(`dashboard_${role}`);
                } else {
                    showToast('Login Failed', result.error || 'Invalid credentials.', 'error');
                    e.target.classList.add('shake');
                    setTimeout(() => e.target.classList.remove('shake'), 500);
                }
            } catch (err) {
                showToast('Error', 'Server connection failed', 'error');
            }
        }

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            const content = modal.querySelector('div[id$="-content"]');
            
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                // Animate in
                setTimeout(() => {
                    content.classList.remove('scale-95', 'opacity-0');
                    content.classList.add('scale-100', 'opacity-100');
                }, 10);
            } else {
                content.classList.remove('scale-100', 'opacity-100');
                content.classList.add('scale-95', 'opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 200);
            }
        }

        function toggleSections() {
            const year = document.getElementById('class-year').value;
            const sectionSelector = document.getElementById('section-selector');
            if (parseInt(year) <= 4) {
                sectionSelector.classList.remove('hidden');
            } else {
                sectionSelector.classList.add('hidden');
            }
        }

        async function handleCreateClass(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const year = formData.get('year');
            let section = '';
            
            if (parseInt(year) <= 4) {
                section = formData.get('section');
            }

            const className = parseInt(year) <= 4 ? `Year ${year} - Sec ${section}` : `Year ${year}`;
            const code = generateClassCode();

            const newClass = {
                code,
                name: className,
                teacherUsername: State.currentUser.username,
                students: []
            };

            await DB.saveClass(newClass);
            toggleModal('create-class-modal');
            showToast('Class Created', `Code: ${code}`, 'success');

        }

        async function handleJoinClass(e) {
            e.preventDefault();
            const code = e.target.class_code.value.trim().toUpperCase();
            const result = await DB.joinClass(State.currentUser.username, code);
            
            if (result === true) {
                showToast('Success', 'You have joined the class!', 'success');
                render();
            } else if (result === 'already_joined') {

            } else {
                showToast('Error', 'Invalid Class Code.', 'error');
            }
            e.target.reset();
        }

        function previewImage(input) {
            const container = document.getElementById('image-preview-container');
            const img = document.getElementById('image-preview');
            const placeholder = document.getElementById('upload-placeholder');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.src = e.target.result;
                    container.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function resetUpload() {
            document.getElementById('homework-file').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
        }

        async function handleUploadHomework(e) {
            e.preventDefault();
            const fileInput = document.getElementById('homework-file');
            const teacherUsername = e.target.teacher_username.value;
            const studentMessage = e.target.student_message ? e.target.student_message.value : '';

            if (!teacherUsername) {
                showToast('Error', 'Please select a teacher.', 'error');
                return;
            }

            if (!fileInput.files[0]) {
                showToast('Warning', 'Please take a photo or select a file.', 'info');
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            btn.disabled = true;

            // Wait a tiny bit to let the UI update (button text change)
            await new Promise(r => setTimeout(r, 50));

            try {
                // Compress image (await the promise - now returns Blob directly)
                const compressedBlob = await compressImage(fileInput.files[0]);
                
                const hwData = {
                    id: generateId(),
                    studentUsername: State.currentUser.username,
                    teacherUsername: teacherUsername,
                    classCode: null,
                    status: 'pending',
                    timestamp: new Date().toISOString(),
                    studentMessage: studentMessage
                };

                // Upload
                const res = await API.saveHomework(hwData, compressedBlob);
                
                if(res.success) {
                    showToast('Sent!', `Homework sent to ${teacherUsername} successfully!`, 'success');
                    e.target.reset();
                    resetUpload();
                } else {
                    throw new Error(res.error || "Server could not save homework");
                }
            } catch (err) {
                console.error("Upload process failed:", err);
                showToast('Error', 'Failed to upload homework. Try again.', 'error');
            } finally {
                // Always reset button
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function approveHomework(id) {
            const feedbackInput = document.getElementById(`feedback-${id}`);
            const feedback = feedbackInput ? feedbackInput.value : '';
            
            await DB.updateHomeworkStatus(id, 'approved', feedback);
            showToast('Approved', 'Homework marked as approved.', 'success');
            render(); // Refresh UI to remove from pending
        }

        function viewImage(src) {
            const modal = document.getElementById('image-viewer');
            const img = document.getElementById('image-viewer-src');

            modal.classList.remove('hidden');

        function closeImageViewer() {
            const modal = document.getElementById('image-viewer');
            const img = document.getElementById('image-viewer-src');
            img.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                // Use ObjectURL instead of FileReader for instant loading
                const url = URL.createObjectURL(file);
                const img = new Image();
                
                img.onload = () => {
                    URL.revokeObjectURL(url); // Clean up memory
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Resize to max 800px width
                    
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert directly to Blob (efficient & async)
                    canvas.toBlob((blob) => {
                        if (blob) {
                            resolve(blob);
                        } else {
                            // If compression fails, return original file
                            console.warn("Canvas blob creation failed, using original.");
                            resolve(file);
                        }
                    }, 'image/jpeg', 0.7); // 70% quality
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    console.error("Image failed to load, sending original.");
                    resolve(file); // Fallback to original
                };

                img.src = url;
            });
        }
        window.setEffect = function(mode) {
    const overlay = document.getElementById('season-overlay');
    const rainSound = document.getElementById('rain-sound');
    if (!overlay) return;

    overlay.innerHTML = '';
    if (rainSound) rainSound.pause();
    if (mode === 'clear') return;

    for (let i = 0; i < 150; i++) {
        const p = document.createElement('div');
        p.className = (mode === 'winter') ? 'snow-flake' : 'rain-drop';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (mode === 'winter' ? Math.random() * 3 + 4 : 0.6) + 's';
        p.style.animationDelay = Math.random() * 5 + 's';
        
        if (mode === 'winter') {
            const size = Math.random() * 5 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
        }
        overlay.appendChild(p);
    }
    if (mode === 'rain' && rainSound) {
        rainSound.play().catch(() => {});
    }
};
